<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tema: applica data-theme/data-accent prima del primo paint,
         per evitare il flash del tema sbagliato al caricamento.
         Le chiavi 'theme'/'accent' devono restare in sincrono con
         src/theme/ThemeContext.js. Il chiaro è il tema canonico:
         nessun auto-detect da prefers-color-scheme, solo scelta
         esplicita persistita. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var accent = localStorage.getItem('accent');
          var accents = ['mark', 'ink', 'pine', 'ochre'];
          document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
          document.documentElement.setAttribute('data-accent', accents.indexOf(accent) !== -1 ? accent : 'mark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.setAttribute('data-accent', 'mark');
        }
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Font preload -->
    <link rel="preload" href="/fonts/IBMPlexSans-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexSerif-Regular.woff2" as="font" type="font/woff2" crossorigin />

    <!-- SEO primario -->
    <title>Nicolas Brazzo — Web Developer Frontend | Portfolio</title>
    <meta name="description" content="Web Developer Frontend. Progetto e costruisco interfacce web moderne, performanti e curate nei dettagli con React, Tailwind e GSAP. Aperto a nuove collaborazioni." />
    <meta name="author" content="Nicolas Brazzo" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brzportfolio.vercel.app/" />
    <meta property="og:title" content="Nicolas Brazzo — Web Developer Frontend" />
    <meta property="og:description" content="Progetto e costruisco interfacce web moderne, performanti e curate nei dettagli con React, Tailwind e GSAP. Esplora i miei progetti." />
    <meta property="og:image" content="https://brzportfolio.vercel.app/og-image.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://brzportfolio.vercel.app/" />
    <meta name="twitter:title" content="Nicolas Brazzo — Web Developer Frontend" />
    <meta name="twitter:description" content="Progetto e costruisco interfacce web moderne, performanti e curate nei dettagli con React, Tailwind e GSAP. Esplora i miei progetti." />
    <meta name="twitter:image" content="https://brzportfolio.vercel.app/og-image.png" />

    <!-- Theme color (mobile browser chrome) -->
    <meta name="theme-color" content="#FAF9F6" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
